
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета разработчика </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        form {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 20px;
        }

        h1 {
            font-size: 1.4rem;
            color: #333333;
            margin-bottom: 5px;
        }

        p {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            color: #333333;
            margin-bottom: 5px;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cccccc;
            font-size: 0.85rem;
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
            background: #ffffff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #666666;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #999999;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        div {
            margin-bottom: 5px;
        }

        select[multiple] {
            height: 130px;
        }

        textarea {
            height: 90px;
        }

        button {
            margin-top: 20px;
            padding: 7px 25px;
            background: #dddddd;
            border: 1px solid #999999;
            font-size: 0.9rem;
            font-weight: bold;
            color: #333333;
            cursor: pointer;
        }

        button:hover {
            background: #cccccc;
        }

        small {
            display: block;
            font-size: 0.7rem;
            color: #999999;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <form method="POST" action="index.php">

        <h1>⚡ dev·анкета</h1>
        <p>заполните профиль разработчика</p>

        <!-- ФИО -->
        <label for="fullname">🧑‍💻 ФИО *</label>
        <input type="text" id="fullname" name="fullname" placeholder="Иванов Иван Иванович" required>

        <!-- Телефон -->
        <label for="phone">📱 Телефон</label>
        <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">

        <!-- Email -->
        <label for="email">✉️ E-mail *</label>
        <input type="email" id="email" name="email" placeholder="hello@example.com" required>

        <!-- Дата рождения -->
        <label for="birthdate">🎂 Дата рождения</label>
        <input type="date" id="birthdate" name="birthdate">

        <!-- Пол -->
        <label>⚥ Пол</label>
        <div>
            <input type="radio" name="gender" value="male" id="male"> <label for="male" style="display:inline;font-weight:normal;">Мужской</label>
            <input type="radio" name="gender" value="female" id="female"> <label for="female" style="display:inline;font-weight:normal;">Женский</label>
            <input type="radio" name="gender" value="other" id="other"> <label for="other" style="display:inline;font-weight:normal;">Другой</label>
            <input type="radio" name="gender" value="unspecified" id="unspecified" checked> <label for="unspecified" style="display:inline;font-weight:normal;">Не указан</label>
        </div>

        <!-- Языки программирования -->
        <label for="fav_langs">💻 Любимые языки *</label>
        <select name="fav_langs[]" id="fav_langs" multiple size="6" required>
            <option value="Pascal">Pascal</option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="JavaScript">JavaScript</option>
            <option value="PHP">PHP</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="Haskell">Haskell</option>
            <option value="Clojure">Clojure</option>
            <option value="Prolog">Prolog</option>
            <option value="Scala">Scala</option>
            <option value="Go">Go</option>
        </select>
        <small> Ctrl / Cmd + клик для выбора нескольких языков</small>

        <!-- Биография -->
        <label for="bio">📝 Биография</label>
        <textarea id="bio" name="bio" placeholder="Расскажите о своём опыте в разработке, проектах и интересах..."></textarea>

        <!-- Контракт -->
        <div>
            <input type="checkbox" id="contractCheck" name="contract_agreed" required>
            <label for="contractCheck" style="display:inline;font-weight:normal;">Я принимаю условия обработки данных и пользовательского соглашения *</label>
        </div>

        <!-- Кнопка сохранения -->
        <button type="submit">✨ Сохранить анкету</button>

    </form>

</body>
</html>
